<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion · Panne-o-rama</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body class="page-connexion">
<main class="carte carte-connexion">
    <img class="logo-connexion" th:src="@{/img/logo.png}" alt="Logo Panne-o-rama" width="96" height="96">
    <h1 class="marque-titre">Panne<span class="marque-o">-o-</span>rama</h1>
    <p class="sous-titre">Supervision des incidents sur les équipements des stations</p>

    <p th:if="${param.erreur}" class="alerte alerte-erreur">Identifiant ou mot de passe incorrect.</p>
    <p th:if="${param.deconnecte}" class="alerte alerte-succes">Vous avez été déconnecté.</p>

    <form th:action="@{/connexion}" method="post">
        <label for="username">Identifiant</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="bouton-large">Se connecter</button>
    </form>
</main>
</body>
</html>
