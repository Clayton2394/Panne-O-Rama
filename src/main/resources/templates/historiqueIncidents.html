<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historique des incidents résolus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/bandeau :: bandeau}"></div>

<main>
    <h1>Historique des incidents résolus</h1>

    <p th:if="${incidents.isEmpty()}">Aucun incident résolu pour le moment.</p>

    <table th:unless="${incidents.isEmpty()}">
        <thead>
        <tr>
            <th>Résolu le</th>
            <th>Station</th>
            <th>Équipement</th>
            <th>Description</th>
            <th>Prestataire</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="incident : ${incidents}">
            <td th:text="${#temporals.format(incident.dateResolution, 'dd/MM/yyyy HH:mm')}">Date</td>
            <td th:text="${incident.equipement.station.nom}">Station</td>
            <td>
                <a th:href="@{/equipements/{id}(id=${incident.equipement.id})}"
                   th:text="${incident.equipement.reference}">REF</a>
            </td>
            <td>
                <a th:href="@{/incidents/{id}(id=${incident.id})}"
                   th:text="${incident.description}">Description</a>
            </td>
            <td th:text="${incident.prestataire != null} ? ${incident.prestataire.nom} : '—'">—</td>
        </tr>
        </tbody>
    </table>

    <p><a th:href="@{/}">← Retour à l'accueil</a></p>
</main>
</body>
</html>
