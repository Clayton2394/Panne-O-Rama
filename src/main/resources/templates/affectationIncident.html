<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Affecter un prestataire</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/png" th:href="@{/img/favicon.png}">
</head>
<body>
<div th:replace="~{fragments/bandeau :: bandeau}"></div>
<main class="page">
    <h1 th:text="${incident.prestataire == null} ? |Affecter un prestataire à l'incident n° ${incident.id}|
                                                 : |Réaffecter l'incident n° ${incident.id}|"></h1>

    <section class="carte">
        <h2>Incident concerné</h2>
        <dl>
            <dt>Station</dt>
            <dd th:text="${incident.equipement.station.nom}"></dd>
            <dt>Équipement</dt>
            <dd th:text="|${incident.equipement.reference} – ${incident.equipement.description}|"></dd>
            <dt>Description</dt>
            <dd th:text="${incident.description}"></dd>
            <dt>Prestataire actuel</dt>
            <dd th:if="${incident.prestataire != null}" th:text="${incident.prestataire.nom}"></dd>
            <dd th:unless="${incident.prestataire != null}" class="valeur-absente">Aucun prestataire affecté</dd>
        </dl>
    </section>

    <form class="carte" th:action="@{/incidents/{id}/prestataire(id=${incident.id})}" th:method="patch"
          th:object="${formulaire}">
        <label for="prestataireId">Prestataire</label>
        <select id="prestataireId" th:field="*{prestataireId}"
                th:classappend="${#fields.hasErrors('prestataireId')} ? 'champ-invalide'">
            <option value="">-- Choisir un prestataire --</option>
            <option th:each="prestataire : ${prestataires}" th:value="${prestataire.id}"
                    th:text="${prestataire.estEvalue()}
                             ? |${prestataire.nom} (${prestataire.contact}) · ★ ${#numbers.formatDecimal(prestataire.noteMoyenne, 1, 1, 'COMMA')} / 5 sur ${prestataire.nombreEvaluations} évaluation(s)|
                             : |${prestataire.nom} (${prestataire.contact}) · pas encore évalué|"></option>
        </select>
        <p class="message-erreur" th:each="erreur : ${#fields.errors('prestataireId')}" th:text="${erreur}"></p>

        <button type="submit">Enregistrer</button>
    </form>

    <p><a th:href="@{/incidents/{id}(id=${incident.id})}">← Retour au détail de l'incident</a></p>
</main>
</body>
</html>
