<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Déclarer un incident</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page">
    <h1>Déclarer un incident</h1>

    <section class="carte">
        <h2>Équipement concerné</h2>
        <dl>
            <dt>Référence</dt>
            <dd th:text="${equipement.reference}"></dd>
            <dt>Description</dt>
            <dd th:text="${equipement.description}"></dd>
            <dt>Type</dt>
            <dd th:text="${equipement.type}"></dd>
            <dt>Station</dt>
            <dd th:text="${equipement.station.nom}"></dd>
        </dl>
    </section>

    <form class="carte" th:action="@{/equipements/{id}/incidents(id=${equipement.id})}"
          th:object="${formulaire}" method="post">
        <label for="description">Description de la panne</label>
        <textarea id="description" th:field="*{description}" rows="5"
                  th:classappend="${#fields.hasErrors('description')} ? 'champ-invalide'"></textarea>
        <p class="message-erreur" th:each="erreur : ${#fields.errors('description')}" th:text="${erreur}"></p>

        <button type="submit">Déclarer l'incident</button>
    </form>
</main>
</body>
</html>
